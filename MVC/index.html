<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Library</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" type="image/png" href="./favicon.ico"/>
</head>

<body>
<main class="max-w-6xl mx-auto px-6 py-16">
    <header class="mb-10 flex items-start justify-between gap-4">
        <div>
            <h1 class="text-3xl font-semibold tracking-tight">Library</h1>
            <p class="text-sm text-neutral-500 mt-2">Browse and borrow available books.</p>


        </div>

        <button class="reset-btn text-xs font-medium text-neutral-500 border border-neutral-200 hover:bg-neutral-50 hover:text-neutral-900 px-3 py-1.5 rounded-md transition cursor-pointer">
            Reset
        </button>
    </header>

    <div class="books-container grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-x-6 gap-y-10"></div>
</main>

<script type="module" src="./main.js"></script>
</body>
</html>
