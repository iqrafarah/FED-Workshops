[build]
  command = "pnpm run build"
  publish = ".next"

# Zorgt dat Netlify de Next.js-runtime gebruikt (server-rendering, routes, images).
# Zonder deze runtime wordt .next als statische map geserveerd → overal 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# POSTGRES_DATABASE is alleen de databasenaam (een kort, algemeen woord dat overal
# in de code voorkomt) en geen geheim. Wachtwoord en connection strings blijven
# gewoon gescand.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "POSTGRES_DATABASE"
