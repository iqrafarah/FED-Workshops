[build]
  command = "pnpm run build"
  publish = ".next"

# Zorgt dat Netlify de Next.js-runtime gebruikt (server-rendering, routes, images).
# Zonder deze runtime wordt .next als statische map geserveerd → overal 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# POSTGRES_DATABASE en POSTGRES_USER zijn alleen de database- en gebruikersnaam
# (korte, algemene woorden die overal in de code voorkomen) en geen geheim.
# Wachtwoord en connection strings blijven gewoon gescand.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "POSTGRES_DATABASE,POSTGRES_USER"
